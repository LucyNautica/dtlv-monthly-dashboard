<title>Commercial Pulse</title>
<meta name="robots" content="noindex, nofollow, noarchive">

<style>
:root{--bg:#F4F5F6;--card:#fff;--ink:#14171A;--mut:#6B7280;--line:#E3E5E8;
  --accent:#E8740C;--bad:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#16191D;--ink:#F2F3F4;--mut:#9BA1A8;--line:#262A2F;
  --accent:#FF8A23;--bad:#F2635A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1013;--card:#16191D;--ink:#F2F3F4;--mut:#9BA1A8;
  --line:#262A2F;--accent:#FF8A23;--bad:#F2635A;color-scheme:dark}
*{box-sizing:border-box}
/* every gate rule is scoped to the locked state, so nothing leaks into the
   dashboard's own layout once the page is unlocked */
body:not(.unlocked){margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;display:grid;place-items:center;
  padding:40px max(16px,env(safe-area-inset-left,0px))
          40px max(16px,env(safe-area-inset-right,0px))}
body:not(.unlocked) #gate{width:100%;max-width:380px}
body:not(.unlocked) .gbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:30px 26px 26px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
body:not(.unlocked) .gbrand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
body:not(.unlocked) .gbrand img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#111;padding:3px}
body:not(.unlocked) .gbrand h1{margin:0;font:600 19px/1.15 Oswald,Inter,sans-serif;letter-spacing:.012em}
body:not(.unlocked) .gbrand .s{color:var(--mut);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
body:not(.unlocked) label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);margin-bottom:7px}
body:not(.unlocked) input{width:100%;padding:11px 12px;font-size:15px;font-family:inherit;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:9px;outline:none}
body:not(.unlocked) input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,116,12,.14)}
body:not(.unlocked) button{width:100%;margin-top:12px;padding:11px;font:600 14px/1 Inter,sans-serif;
  color:#fff;background:var(--accent);border:0;border-radius:9px;cursor:pointer}
body:not(.unlocked) button:hover{filter:brightness(1.07)}
body:not(.unlocked) button[disabled]{opacity:.55;cursor:default}
body:not(.unlocked) .msg{min-height:17px;margin-top:11px;font-size:12.5px;color:var(--bad)}
body:not(.unlocked) .msg.w{color:var(--mut)}
body:not(.unlocked) .gfoot{margin-top:16px;font-size:11.5px;line-height:1.5;color:var(--mut);text-align:center}
</style>
</head>

<script>
(function () {
  var RAW = document.getElementById("p").textContent.replace(/\s+/g, "");
  var pw = document.getElementById("pw"), go = document.getElementById("go"),
      msg = document.getElementById("msg");

  function b(s) { var r = atob(s), a = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }

  async function open_(p) {
    var A = b(RAW), salt = A.slice(0, 16), iv = A.slice(16, 28), ct = A.slice(28);
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p),
      "PBKDF2", false, ["deriveKey"]);
    var k = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function paint(o) {
    document.getElementById("gate").remove();
    document.title = o.title;
    var st = document.createElement("style"); st.textContent = o.css;
    document.head.appendChild(st);
    document.body.removeAttribute("style");
    document.body.className = "unlocked";
    document.body.innerHTML = o.body;
    var sc = document.createElement("script"); sc.textContent = o.js;
    document.body.appendChild(sc);
    window.scrollTo(0, 0);
  }

  async function tryIt(p, quiet) {
    if (!p) return false;
    go.disabled = true; msg.className = "msg w"; msg.textContent = "Unlocking…";
    try {
      var o = await open_(p);
      try { sessionStorage.setItem("dtlv", p); } catch (e) {}
      paint(o); return true;
    } catch (e) {
      go.disabled = false; msg.className = "msg";
      msg.textContent = quiet ? "" : "That password isn’t right.";
      if (!quiet) { pw.select(); }
      return false;
    }
  }

  if (!(window.crypto && crypto.subtle)) {
    msg.className = "msg";
    msg.textContent = "This browser can’t open the page. Try Chrome, Edge, Safari or Firefox.";
    go.disabled = true;
    return;
  }

  go.onclick = function () { tryIt(pw.value.trim(), false); };
  pw.onkeydown = function (e) { if (e.key === "Enter") go.click(); };

  var saved = null;
  try { saved = sessionStorage.getItem("dtlv"); } catch (e) {}
  if (saved) { tryIt(saved, true).then(function (ok) { if (!ok) pw.focus(); }); }
  else { pw.focus(); }
})();
</script>
